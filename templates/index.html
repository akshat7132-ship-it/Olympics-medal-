<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akshat Jain | Tableau Project</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f4f6f9; color: #172033; }
    header { background: #14213d; color: white; padding: 22px 5%; }
    header h1 { margin: 0 0 6px; font-size: 24px; }
    header p { margin: 0; color: #dbe4f0; }
    nav { display: flex; gap: 10px; padding: 14px 5%; background: white; box-shadow: 0 2px 8px #00000012; }
    nav button { border: 0; border-radius: 7px; padding: 11px 20px; cursor: pointer; font-size: 15px; background: #e8edf5; color: #172033; }
    nav button.active { background: #2563eb; color: white; }
    main { padding: 22px 5%; }
    .panel { background: white; border-radius: 10px; padding: 14px; box-shadow: 0 3px 14px #0000000d; }
    .panel h2 { margin: 2px 0 12px; font-size: 19px; }
    .tableau-frame { width: 100%; height: calc(100vh - 230px); min-height: 560px; border: 0; display: block; }
    .hint { color: #64748b; font-size: 13px; margin: 12px 2px 0; }
    @media (max-width: 600px) {
      header h1 { font-size: 20px; }
      nav button { flex: 1; padding: 10px 8px; }
      main { padding: 14px 3%; }
      .tableau-frame { height: 75vh; min-height: 480px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Akshat Jain — Tableau Project</h1>
    <p>Explore the interactive story and dashboard</p>
  </header>

  <nav aria-label="Tableau views">
    <button id="storyBtn" class="active" type="button" onclick="showView('story')">Story</button>
    <button id="dashboardBtn" type="button" onclick="showView('dashboard')">Dashboard</button>
  </nav>

  <main>
    <section class="panel">
      <h2 id="viewTitle">Project Story</h2>
      <iframe
        id="tableauView"
        class="tableau-frame"
        title="Tableau Story"
        src="https://public.tableau.com/views/Book1_17934483586790/Story1?:showVizHome=no&:embed=true"
        allowfullscreen>
      </iframe>
      <p class="hint">Use the buttons above to switch between the Tableau story and dashboard. Tableau Public must be accessible for the views to load.</p>
    </section>
  </main>

  <script>
    const views = {
      story: {
        title: "Project Story",
        url: "https://public.tableau.com/views/Book1_17934483586790/Story1?:showVizHome=no&:embed=true"
      },
      dashboard: {
        title: "Project Dashboard",
        url: "https://public.tableau.com/views/Book1_17934483586790/Dashboard1?:showVizHome=no&:embed=true"
      }
    };

    function showView(name) {
      const view = views[name];
      document.getElementById("tableauView").src = view.url;
      document.getElementById("tableauView").title = view.title;
      document.getElementById("viewTitle").textContent = view.title;
      document.getElementById("storyBtn").classList.toggle("active", name === "story");
      document.getElementById("dashboardBtn").classList.toggle("active", name === "dashboard");
    }
  </script>
</body>
</html>
